    // ========== WEB WORKER ==========
    let computationWorker = null;
    function initWebWorker() {
      if (window.Worker) {
        try {
          const workerCode = `
            self.onmessage = function(e) {
              const { type, data } = e.data;
              if (type === 'analyzeTrend') {
                const { gridHistory, startGlobalSpan, xzTickCounter } = data;
                if (!startGlobalSpan || !gridHistory || gridHistory.length < 6) { self.postMessage({ type: 'trendResult', result: null }); return; }
                const vis = gridHistory.length;
                const firstGlobal = xzTickCounter - vis;
                const startFrom = startGlobalSpan.to - firstGlobal + 1;
                if (startFrom < 0 || startFrom >= vis - 2) { self.postMessage({ type: 'trendResult', result: null }); return; }
                const afterStart = [];
                for (let i = startFrom; i < vis; i++) { afterStart.push({ v: gridHistory[i].v, row: gridHistory[i].row, color: gridHistory[i].effColor }); }
                if (afterStart.length < 3) { self.postMessage({ type: 'trendResult', result: null }); return; }
                const last3 = afterStart.slice(-3);
                const v1 = last3[0].v, v2 = last3[1].v, v3 = last3[2].v;
                const c1 = last3[0].color, c2 = last3[1].color, c3 = last3[2].color;
                let trendDirection = null;
                const compare12 = v2 > v1 ? 'up' : (v2 < v1 ? 'down' : 'flat');
                const compare23 = v3 > v2 ? 'up' : (v3 < v2 ? 'down' : 'flat');
                const compare13 = v3 > v1 ? 'up' : (v3 < v1 ? 'down' : 'flat');
                if (compare12 === 'up' && compare23 === 'up' && compare13 === 'up') { trendDirection = 'UP'; }
                else if (compare12 === 'down' && compare23 === 'down' && compare13 === 'down') { trendDirection = 'DOWN'; }
                else if (compare12 === 'down' && compare23 === 'up') { if (v3 > v1 || v3 >= v2) trendDirection = 'UP'; }
                else if (compare12 === 'up' && compare23 === 'down') { if (v3 < v1 || v3 <= v2) trendDirection = 'DOWN'; }
                else {
                  const blueCount = [c1,c2,c3].filter(c => c === 'blue').length;
                  const redCount = [c1,c2,c3].filter(c => c === 'red').length;
                  if (blueCount >= 2 && compare13 === 'up') trendDirection = 'UP';
                  else if (redCount >= 2 && compare13 === 'down') trendDirection = 'DOWN';
                }
                self.postMessage({ type: 'trendResult', result: { direction: trendDirection, last3: [v1,v2,v3], colors: [c1,c2,c3] } });
              }
            };
          `;
          const blob = new Blob([workerCode], { type: 'application/javascript' });
          computationWorker = new Worker(URL.createObjectURL(blob));
          computationWorker.onmessage = function(e) {
            if (e.data.type === 'trendResult') {
              if (e.data.result) { currentTrendData = e.data.result; showTrendSignal(e.data.result.direction); }
              workerBusy = false;
              processWorkerQueue();
            }
          };
        } catch(error) { console.log('Worker fallback:', error); }
      }
    }

    function processWorkerQueue() {
      if (workerBusy || workerMessageQueue.length === 0) return;
      const nextTask = workerMessageQueue.shift();
      workerBusy = true;
      if (computationWorker) { computationWorker.postMessage(nextTask); }
      else { setTimeout(() => { handleWorkerTask(nextTask); workerBusy = false; processWorkerQueue(); }, 0); }
    }

    function handleWorkerTask(task) {
      if (task.type === 'analyzeTrend') {
        const result = analyzeTrendFallback(task.data);
        if (result) { currentTrendData = result; showTrendSignal(result.direction); }
      }
    }

    function analyzeTrendFallback(data) {
      const { gridHistory, startGlobalSpan, xzTickCounter } = data;
      if (!startGlobalSpan || !gridHistory || gridHistory.length < 6) return null;
      const vis = gridHistory.length;
      const firstGlobal = xzTickCounter - vis;
      const startFrom = startGlobalSpan.to - firstGlobal + 1;
      if (startFrom < 0 || startFrom >= vis - 2) return null;
      const afterStart = [];
      for (let i = startFrom; i < vis; i++) afterStart.push({ v: gridHistory[i].v, row: gridHistory[i].row, color: gridHistory[i].effColor });
      if (afterStart.length < 3) return null;
      const last3 = afterStart.slice(-3);
      const v1 = last3[0].v, v2 = last3[1].v, v3 = last3[2].v;
      const c1 = last3[0].color, c2 = last3[1].color, c3 = last3[2].color;
      let trendDirection = null;
      const compare12 = v2 > v1 ? 'up' : (v2 < v1 ? 'down' : 'flat');
      const compare23 = v3 > v2 ? 'up' : (v3 < v2 ? 'down' : 'flat');
      const compare13 = v3 > v1 ? 'up' : (v3 < v1 ? 'down' : 'flat');
      if (compare12==='up'&&compare23==='up'&&compare13==='up') trendDirection='UP';
      else if (compare12==='down'&&compare23==='down'&&compare13==='down') trendDirection='DOWN';
      else if (compare12==='down'&&compare23==='up') { if(v3>v1||v3>=v2) trendDirection='UP'; }
      else if (compare12==='up'&&compare23==='down') { if(v3<v1||v3<=v2) trendDirection='DOWN'; }
      else {
        const blueCount=[c1,c2,c3].filter(c=>c==='blue').length;
        const redCount=[c1,c2,c3].filter(c=>c==='red').length;
        if(blueCount>=2&&compare13==='up') trendDirection='UP';
        else if(redCount>=2&&compare13==='down') trendDirection='DOWN';
      }
      return { direction: trendDirection, last3: [v1,v2,v3], colors: [c1,c2,c3] };
    }

    // ========== UP/DOWN SİNYAL ==========
    function analyzeUpDownSignal(arrows) {
      if (!arrows || arrows.length < 2) return null;
      const lastArrows = arrows.slice(-3); if (lastArrows.length < 2) return null;
      let upCount = 0, downCount = 0;
      lastArrows.forEach(function(arrow) { if(arrow==='up') upCount++; else if(arrow==='down') downCount++; });
      if (upCount >= 2 && downCount >= 1) return 'UP';
      if (downCount >= 2 && upCount >= 1) return 'DOWN';
      return null;
    }
    function showUpDownSignal(signal) {
      if (signal === 'UP') { currentUpDownSignal='UP'; if(lastUpDownSignal!=='UP') executeAutoTrade(); lastUpDownSignal='UP'; }
      else if (signal === 'DOWN') { currentUpDownSignal='DOWN'; if(lastUpDownSignal!=='DOWN') executeAutoTrade(); lastUpDownSignal='DOWN'; }
      else { currentUpDownSignal=null; lastUpDownSignal=null; }
    }

    // Start'tan itibaren gelen sayıları tampona ekle
    function updateTrendDrawBuffer() {
      if (currentGraph !== 'XZ' || !startGlobalSpan) {
        trendDrawBuffer = [];
        trendDrawStarted = false;
        lastStartSpanKey = null;
        clearDrawPanels();
        return;
      }

      const spanKey = startGlobalSpan.from + '_' + startGlobalSpan.to;

      // Yeni bir start algılandıysa tamponu sıfırla
      if (spanKey !== lastStartSpanKey) {
        trendDrawBuffer = [];
        trendDrawStarted = true;
        lastStartSpanKey = spanKey;
      }

      if (!trendDrawStarted) return;

      // Start çerçevesinin 1. sayısından (from) itibaren 6 sayı topla
      // İlk 3 → panel 1, sonraki 3 → panel 2
      const vis = gridHistory.length;
      const firstGlobal = xzTickCounter - vis;
      const startFromLocal = startGlobalSpan.from - firstGlobal; // 1. sayının local indexi

      if (startFromLocal < 0 || startFromLocal >= vis) return;

      // startFromLocal'dan itibaren max 6 sayı topla
      const newBuffer = [];
      for (let i = startFromLocal; i < vis && newBuffer.length < 6; i++) {
        newBuffer.push({
          v: gridHistory[i].v,

    function renderDrawPanels() {
      const svg1 = document.getElementById('drawSvg1');
      const svg2 = document.getElementById('drawSvg2');
      if (!svg1 || !svg2) return;

      svg1.innerHTML = '';
      svg2.innerHTML = '';

      const buf = trendDrawBuffer;

      // Panel 1: ilk 3 sayı (buf[0], buf[1], buf[2])
      if (buf.length < 3) return;

      const p1 = [buf[0], buf[1], buf[2]];
      drawThreePointPanel(svg1, p1);

      // Açı kontrolü: 1. ve 3. sayı farklıysa açı var
      const hasAngle = (p1[0].v !== p1[2].v);
      if (!hasAngle) return;

      // Panel 2: sonraki 3 sayı (buf[3], buf[4], buf[5])
      if (buf.length < 6) return;

      const p2 = [buf[3], buf[4], buf[5]];
      drawThreePointPanel(svg2, p2);
    }

    function drawThreePointPanel(svg, points) {
      const W = 100, H = 100;
      const RADIUS = 8;
      const GAP = 6;
      const ns = 'http://www.w3.org/2000/svg';

      // Renk: mavi=pozitif(üst), kırmızı=negatif(alt)
      // Y pozisyonu için: mavi sayılar çizginin üstünde, kırmızı altında
      // val hesabı: mavi → +v, kırmızı → -v (negatif)
      const sign = function(p) { return p.color === 'red' ? -p.v : p.v; };
      const firstVal = sign(points[0]);
      const lastVal  = sign(points[2]);
      const midVal   = sign(points[1]);

      const lastHigher = lastVal > firstVal;

      const orangeY = H / 2;

      // 1. ve 3. dairenin Y konumu
      const firstY = lastHigher
        ? orangeY + RADIUS + GAP    // 1. daire çizginin ALTINDA
        : orangeY - RADIUS - GAP;  // 1. daire çizginin ÜSTÜNDE

      const lastY = lastHigher
        ? orangeY - RADIUS - GAP   // 3. daire çizginin ÜSTÜNDE
        : orangeY + RADIUS + GAP;  // 3. daire çizginin ALTINDA

      // 2. (orta) nokta Y konumu - PDF mantığıyla birebir
      const allVals = [firstVal, midVal, lastVal];
      const minAll = Math.min(...allVals);
      const maxAll = Math.max(...allVals);
      const topY = 10, botY = H - 10;
      let midY;
      if (midVal === maxAll) {
        midY = topY;
      } else if (midVal === minAll) {
        midY = botY;
      } else {
        const diff = Math.abs(firstVal - lastVal);
        const ratio = diff > 0
          ? (midVal - Math.min(firstVal, lastVal)) / diff
          : 0.5;
        const hiY = Math.min(firstY, lastY);
        const loY = Math.max(firstY, lastY);
        midY = loY - ratio * (loY - hiY);
      }

      // X konumları
      const x1 = 18, x2 = W / 2, x3 = W - 18;
      const ys = [firstY, midY, lastY];
      const xs = [x1, x2, x3];

      // Turuncu çizgi (düz, simetrik)
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', '4');
      line.setAttribute('y1', String(orangeY));
      line.setAttribute('x2', String(W - 4));
      line.setAttribute('y2', String(orangeY));
      line.setAttribute('stroke', '#e08000');
      line.setAttribute('stroke-width', '2.5');
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);

      // Beyaz bağlantı çizgisi
      const polyline = document.createElementNS(ns, 'polyline');
      polyline.setAttribute('points', xs.map((x, i) => `${x},${ys[i]}`).join(' '));
      polyline.setAttribute('fill', 'none');
      polyline.setAttribute('stroke', 'white');
      polyline.setAttribute('stroke-width', '2');
      polyline.setAttribute('stroke-linejoin', 'round');
      polyline.setAttribute('stroke-linecap', 'round');
      svg.appendChild(polyline);

      // Daireler ve sayılar
      points.forEach(function(p, i) {
        const cx = xs[i], cy = ys[i];
        const isNeg = p.color === 'red';
        const fillColor = isNeg ? '#cc1111' : '#1133cc';

        // Beyaz halka
        const outerCircle = document.createElementNS(ns, 'circle');
        outerCircle.setAttribute('cx', String(cx));
        outerCircle.setAttribute('cy', String(cy));
        outerCircle.setAttribute('r', String(RADIUS + 1.5));
        outerCircle.setAttribute('fill', 'white');
        svg.appendChild(outerCircle);

        // Renkli iç daire
        const innerCircle = document.createElementNS(ns, 'circle');
        innerCircle.setAttribute('cx', String(cx));
        innerCircle.setAttribute('cy', String(cy));
        innerCircle.setAttribute('r', String(RADIUS));
        innerCircle.setAttribute('fill', fillColor);
        svg.appendChild(innerCircle);

        // Sayı
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', String(cx));
        text.setAttribute('y', String(cy));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', 'white');
        text.setAttribute('font-size', '11');
        text.setAttribute('font-weight', '900');
        text.setAttribute('font-family', 'Georgia, serif');
        text.textContent = String(p.v);
        svg.appendChild(text);
      });

      // Ok işareti: 3. nokta (lastY) turuncu çizginin üstünde mi altında mı?
      // SVG Y: küçük=yukarı (üst), büyük=aşağı (alt)
      // lastY < orangeY → mavi yukarı ok → sağ üst köşe
      // lastY > orangeY → kırmızı aşağı ok → sağ alt köşe
      const lastAbove = lastY < orangeY;
      const arrowColor = lastAbove ? '#1155ff' : '#cc1111';
      const ax = W - 8;   // ok merkezi X
      const aw = 5;        // ok yarı genişliği
      const ah = 7;        // ok yüksekliği
      let arrowPts;
      if (lastAbove) {
        // Yukarı ok ▲ - sağ üst köşe
        const ay = 10;
        arrowPts = (ax)+','+(ay-ah/2)+' '+(ax-aw)+','+(ay+ah/2)+' '+(ax+aw)+','+(ay+ah/2);
      } else {
        // Aşağı ok ▼ - sağ alt köşe
        const ay = H - 10;
        arrowPts = (ax)+','+(ay+ah/2)+' '+(ax-aw)+','+(ay-ah/2)+' '+(ax+aw)+','+(ay-ah/2);
      }
      const arrowPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      arrowPoly.setAttribute('points', arrowPts);
      arrowPoly.setAttribute('fill', arrowColor);
      svg.appendChild(arrowPoly);
      // Ok sapı
      const arrowStem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      if (lastAbove) {
        arrowStem.setAttribute('x1', String(ax)); arrowStem.setAttribute('y1', String(10 + ah/2));
        arrowStem.setAttribute('x2', String(ax)); arrowStem.setAttribute('y2', String(10 + ah/2 + 6));
      } else {
        arrowStem.setAttribute('x1', String(ax)); arrowStem.setAttribute('y1', String(H - 10 - ah/2));
        arrowStem.setAttribute('x2', String(ax)); arrowStem.setAttribute('y2', String(H - 10 - ah/2 - 6));
      }
      arrowStem.setAttribute('stroke', arrowColor);
      arrowStem.setAttribute('stroke-width', '2.5');
      arrowStem.setAttribute('stroke-linecap', 'round');
      svg.appendChild(arrowStem);
    }

    // ========== API ==========
    function _triggerReconnect() {
      if(!wsReconnectEnabled) return;
      clearInterval(wsPingTimer);
      clearInterval(wsHeartbeatTimer);
      // AUTO'yu durdur - bağlantı kopukken işlem açılmasın
      if(autoTradeEnabled){ autoTradeEnabled = false; const ab=document.getElementById('autoTradeBtn'); if(ab) ab.classList.remove('active'); }
      // Kullanıcıya sarı uyarı
      const btn = document.getElementById('connectBtn');
      if(btn){ btn.textContent = 'Bağlanıyor...'; btn.style.background = '#b8860b'; }
      // Exponential backoff: 5s → 10s → 20s → max 30s
      clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(function(){
        if(wsReconnectEnabled){ wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000); _openWS(); }
      }, wsReconnectDelay);
    }
    function _setupWSEvents() {
      derivWS.onclose = function(e) {
        if(!wsReconnectEnabled) return;
        _triggerReconnect();
      };
      derivWS.onerror = function(e) {
        if(derivWS) { try { derivWS.close(); } catch(ex){} }
      };
    }
    function _scheduleRender() {
      if(_pendingRender) return; // Zaten bekleyen render var
      _pendingRender = true;
      const now = Date.now();
      const elapsed = now - _lastTickRender;
      const delay = Math.max(0, _tickRenderThrottle - elapsed);
      setTimeout(function(){
        _pendingRender = false;
        _lastTickRender = Date.now();
        renderWormLines('numbersTop', wormLinesTop.slice(-7));
        renderXYArea();
        renderStartOverlay();
        drawTrendAngle();
      }, delay);
    }

      apiToken = '';

    function _openWS() {
      if(derivWS && derivWS.readyState === WebSocket.OPEN) return;
      derivWS=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
      derivWS.onopen=function(){
        wsReconnectDelay = 5000; // başarılı bağlantıda delay sıfırla
        wsLastPong = Date.now();
        derivWS.send(JSON.stringify({authorize:apiToken}));

        // Ping: her 25 saniyede bir gönder
        clearInterval(wsPingTimer);
        wsPingTimer = setInterval(function(){
          if(derivWS && derivWS.readyState === WebSocket.OPEN){
            derivWS.send(JSON.stringify({ping:1}));
          }
        }, 25000);

        // Heartbeat: her 10 saniyede readyState + pong kontrolü
        clearInterval(wsHeartbeatTimer);
        wsHeartbeatTimer = setInterval(function(){
          if(!wsReconnectEnabled) return;
          // readyState OPEN değilse hemen reconnect
          if(!derivWS || derivWS.readyState !== WebSocket.OPEN){
            _triggerReconnect();
            return;
          }
          // Son pong 60 saniyeden eskiyse bağlantı ölü say
          if(Date.now() - wsLastPong > 60000){
            derivWS.close();
            _triggerReconnect();
          }
        }, 10000);
      };
      _setupWSEvents();
      derivWS.onmessage=function(msg){
        const data=JSON.parse(msg.data);
        if(data.ping || data.pong){ wsLastPong = Date.now(); return; }
        if(data.authorize){ document.getElementById('connectBtn').textContent='Disconnect'; document.getElementById('connectBtn').style.background='#d93025'; clearTimeout(wsReconnectTimer); alert('API Bağlantısı Başarılı!');if(data.authorize.balance)document.getElementById('balanceValue').innerText='$ '+parseFloat(data.authorize.balance).toFixed(2);derivWS.send(JSON.stringify({balance:1,subscribe:1}));}
        if(data.balance)document.getElementById('balanceValue').innerText='$ '+parseFloat(data.balance.balance).toFixed(2);
        if(data.proposal_open_contract){
          const contract=data.proposal_open_contract;
          if(tradeActive&&contract.tick_stream){
            const ticks=contract.tick_stream;
            if(tradeData.length===0&&ticks.length>0){entrySpot=parseFloat(ticks[0].tick);barrier=parseFloat(contract.barrier||entrySpot);tradeData=[entrySpot];document.getElementById('tradeChart').style.display='block';}
            if(ticks.length>tradeData.length&&tradeData.length<6){for(let i=tradeData.length;i<Math.min(ticks.length,6);i++)tradeData.push(parseFloat(ticks[i].tick));drawTradeChart();}
          }
          if(contract.status==='won'||contract.status==='lost'){if(contract.exit_tick)exitSpot=parseFloat(contract.exit_tick);const profit=parseFloat(contract.profit||0);document.getElementById('profitValue').innerText=(profit>=0?'$ +':'$ ')+profit.toFixed(2);drawTradeChart();tradeActive=false;}
        }
        if(data.error)alert('API Hatası: '+data.error.message);
      };
    }
    function placeTrade(type) {
      if(!apiToken||!derivWS||derivWS.readyState!==WebSocket.OPEN){alert('Önce API bağlantısı yapın!');return;}
      const stakeInput=document.getElementById('stakeInput'); let stake=parseFloat(stakeInput.value);
      if(isNaN(stake)||stake<0.35){alert('Minimum stake 0.35 USD olmalı!');stakeInput.value='1';return;}

        if(data.error){alert('Trade Hatası: '+data.error.message);derivWS.removeEventListener('message',handleProposal);}
      };
      derivWS.addEventListener('message',handleProposal);
    }

    function drawTradeChart() {

        const canvas=document.getElementById('tradeCanvas'); if(!canvas||tradeData.length===0) return;
        const rect=canvas.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
        canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
        const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,rect.width,rect.height);
        const isDark=!document.body.classList.contains('day-mode');
        const width=rect.width,height=rect.height,padding=12;
        const allValues=tradeData.concat([barrier]); const minVal=Math.min(...allValues),maxVal=Math.max(...allValues);
        const range=maxVal-minVal||0.001; const aMin=minVal-(range*0.1),aMax=maxVal+(range*0.1),aRange=aMax-aMin;
        function getY(val){return height-padding-((val-aMin)/aRange)*(height-2*padding);}
        if(tradeData.length>0){ctx.strokeStyle='#FF8C00';ctx.lineWidth=1.5;ctx.setLineDash([4,2]);ctx.beginPath();ctx.moveTo(padding,padding);ctx.lineTo(padding,height-padding);ctx.stroke();ctx.setLineDash([]);ctx.font='7px sans-serif';ctx.fillStyle='#FF8C00';ctx.textAlign='center';ctx.fillText('Entry',padding,padding-2);}
        if(barrier>0){const bY=getY(barrier);ctx.strokeStyle=isDark?'#fff':'#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(padding,bY);ctx.lineTo(width-padding,bY);ctx.stroke();ctx.font='7px sans-serif';ctx.fillStyle=isDark?'#fff':'#000';ctx.textAlign='left';ctx.fillText('Barrier',padding+2,bY-3);}
        if(tradeData.length>0){const stepX=(width-2*padding)/5;ctx.strokeStyle='#6B8CAE';ctx.lineWidth=1.5;ctx.beginPath();tradeData.forEach(function(val,i){const x=padding+(i*stepX),y=getY(val);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();tradeData.forEach(function(val,i){if(i<1)return;const x=padding+(i*stepX),y=getY(val);ctx.fillStyle='#6B8CAE';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();});if(tradeData.length===6){const exitX=padding+(5*stepX);ctx.strokeStyle='#FF8C00';ctx.lineWidth=1.5;ctx.setLineDash([4,2]);ctx.beginPath();ctx.moveTo(exitX,padding);ctx.lineTo(exitX,height-padding);ctx.stroke();ctx.setLineDash([]);ctx.font='7px sans-serif';ctx.fillStyle='#FF8C00';ctx.textAlign='center';ctx.fillText('Exit',exitX,padding-2);}}
        if(tradeData.length===6&&exitSpot>0){const won=(tradeType==='CALL'&&exitSpot>barrier)||(tradeType==='PUT'&&exitSpot<barrier);ctx.fillStyle=won?'rgba(76,175,80,0.15)':'rgba(244,67,54,0.15)';ctx.fillRect(0,0,width,height);}
      });
    }

    // ========== GRID ==========
    function isEven(n){return(n%2)===0;}
    function decideRow(prev,currV,effColor){
      if(!prev) return (effColor==='blue')?'top':'bottom';
      if(currV===prev.v&&effColor===prev.effColor) return prev.row;
      if(prev.effColor!==effColor) return (effColor==='blue')?'top':'bottom';
      if(effColor==='blue') return (currV>prev.v)?'top':'bottom';
      else return (currV<prev.v)?'top':'bottom';
    }
    function updateGridFromLast11() {
      if(currentGraph!=='XZ'){gridHistory=[];startGlobalSpan=null;startCooldown=0;renderTwoRowGrid();renderStartOverlay();return;}
      const vis=Math.min(7,decimalDigits.length);
      if(vis<=0){gridHistory=[];renderTwoRowGrid();renderStartOverlay();return;}
      const decSlice=decimalDigits.slice(-vis).map(function(x){let v=parseInt((x||'0'),10);if(isNaN(v))v=0;return v;});
      const colSlice=numColors.slice(-vis); const newHist=[];
      for(let i=0;i<vis;i++){
        const raw=colSlice[i]||'#666'; const rawColor=(raw==='blue'||raw==='red')?raw:'#666';
        const prev=newHist.length?newHist[newHist.length-1]:null;
        let effColor=rawColor; if(effColor!=='blue'&&effColor!=='red') effColor=prev?prev.effColor:'blue';
        const row=decideRow(prev,decSlice[i],effColor);
        newHist.push({v:decSlice[i],rawColor:rawColor,effColor:effColor,row:row});
      }
      gridHistory=newHist;
      if(startCooldown>0) startCooldown--;
      detectStartGlobal();
      renderTwoRowGrid();
      renderStartOverlay();
      checkAndSignalTrend();
      // YENİ: trend çizim tamponunu güncelle
      updateTrendDrawBuffer();
      setTimeout(renderStartOverlay,0);
    }
    function detectStartGlobal() {
      if(currentGraph!=='XZ') return; if(startCooldown>0) return; if(gridHistory.length<2) return;
      const vis=gridHistory.length,firstGlobal=xzTickCounter-vis,n=vis;
      const a=gridHistory[n-2].v, b=gridHistory[n-1].v;
      // Tek+çift veya çift+tek yan yana gelirse start
      const cond = (isEven(a) && !isEven(b)) || (!isEven(a) && isEven(b));
      if(cond){
        startGlobalSpan={from:firstGlobal+(n-2),to:firstGlobal+(n-1)};
        startCooldown=6; trendStartGlobal=firstGlobal+(n-1);
        lastTrendSignal=null; showTrendSignal(null);
        currentTrendData={direction:null,last3:[],colors:[],arrows:[]};
        showUpDownSignal(null);
        // YENİ: Yeni start algılandığında çizim tamponunu sıfırla
        trendDrawBuffer=[]; trendDrawStarted=false; lastStartSpanKey=null;
        clearDrawPanels();
      }
    }
    function renderTwoRowGrid() {
      if(_rafPending) return; _rafPending=true;
      requestAnimationFrame(()=>{ _rafPending=false;
        const topRow=document.getElementById('gridTopRow'),botRow=document.getElementById('gridBottomRow'),dividerLine=document.getElementById('gridDividerLine');
        if(!topRow||!botRow||!dividerLine) return;
        topRow.innerHTML=''; botRow.innerHTML=''; const vis=gridHistory.length;
        if(vis===0){dividerLine.style.width='0px';return;}
        const topFragment=document.createDocumentFragment(),botFragment=document.createDocumentFragment();
        // Buffer bilgisini önceden hazırla: hangi global index'lere ok gidecek
        const arrowMap = {}; // globalIndex -> 'up' | 'down'
        if(trendDrawBuffer && trendDrawBuffer.length >= 2 && startGlobalSpan) {
          const firstGlobalBuf = xzTickCounter - vis;
          const bufStartIdx = startGlobalSpan.from - firstGlobalBuf;
          [[0,1],[2,3],[4,5]].forEach(function(pair) {
            const bi0=pair[0], bi1=pair[1];
            if(trendDrawBuffer.length <= bi1) return;
            const gi0=bufStartIdx+bi0, gi1=bufStartIdx+bi1;
            if(gi0<0||gi0>=vis||gi1<0||gi1>=vis) return;
            const it0=trendDrawBuffer[bi0], it1=trendDrawBuffer[bi1];
            const s0=it0.color==='red'?-it0.v:it0.v;
            const s1=it1.color==='red'?-it1.v:it1.v;
            arrowMap[gi0] = s0>s1 ? 'up' : 'down';
            arrowMap[gi1] = s1>s0 ? 'up' : 'down';

        for(let i=0;i<vis;i++){

        dividerLine.style.width=(vis*cellW)+'px';


      });
    }

            const pt1=meta.data[i],pt2=meta.data[i+1]; if(!pt1||!pt2) continue;
            const midX=(pt1.x+pt2.x)/2,midY=(pt1.y+pt2.y)/2;
            ctx.strokeStyle=isDark?'#40E0D0':'#000';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(midX-18,midY);ctx.lineTo(midX+18,midY);ctx.stroke();
            ctx.font='bold 9px sans-serif';ctx.fillStyle=isDark?'#40E0D0':'#000';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VZ',midX,midY-10);
            let arrowColor='';
            if(c1===c2){if(c1==='blue')arrowColor=v2>v1?'blue':'red';else if(c1==='red')arrowColor=v2<v1?'blue':'red';}
            else{if(c1==='blue'&&c2==='red')arrowColor=v1<v2?'red':'blue';else if(c1==='red'&&c2==='blue')arrowColor=v2>v1?'blue':'red';}
            if(!arrowColor) continue;
            const arrowX=midX+35,arrowSize=7,stemLength=16;
            ctx.strokeStyle=arrowColor;ctx.fillStyle=arrowColor;ctx.lineWidth=2;
            if(arrowColor==='blue'){ctx.beginPath();ctx.moveTo(arrowX-stemLength*0.707,midY+stemLength*0.707);ctx.lineTo(arrowX,midY);ctx.stroke();ctx.beginPath();ctx.moveTo(arrowX,midY);ctx.lineTo(arrowX-arrowSize,midY);ctx.lineTo(arrowX,midY+arrowSize);ctx.closePath();ctx.fill();}
            else{ctx.beginPath();ctx.moveTo(arrowX-stemLength*0.707,midY-stemLength*0.707);ctx.lineTo(arrowX,midY);ctx.stroke();ctx.beginPath();ctx.moveTo(arrowX,midY);ctx.lineTo(arrowX-arrowSize,midY);ctx.lineTo(arrowX,midY-arrowSize);ctx.closePath();ctx.fill();}
          }
          ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
          const digs=digits.slice(-7),combs=combinedDigits.slice(-7),worms=wormLinesTop.slice(-7);
          meta.data.forEach(function(pt,i){
            let t=''; if(currentGraph==='XZ')t=decs[i]||'';else if(currentGraph==='ZZ')t=digs[i]||'';else t=(combs[i]||'').replace(',','.');
            if(pt&&pt.x!==undefined){let fillColor=colors[i]||'#000';if(fillColor==='blue')fillColor='#6A9FFF';ctx.fillStyle=fillColor;ctx.fillText(t,pt.x,pt.y-2);const wormColor=worms[i];if(wormColor==='blue'||wormColor==='red'){ctx.strokeStyle=wormColor;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pt.x-5,pt.y-2);ctx.lineTo(pt.x+5,pt.y-2);ctx.stroke();}}
          });
          const last=meta.data[meta.data.length-1];
          if(last&&last.x!==undefined){ctx.strokeStyle=isDark?'#40E0D0':'#000';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(chartInstance.scales.x.left,last.y);ctx.lineTo(last.x,last.y);ctx.stroke();}
        }}]
      });
    }

    // ========== BAŞLATMA ==========
    document.
addEventListener('DOMContentLoaded', function() {
      setTimeout(()=>{document.getElementById('loadingIndicator').style.opacity='0';setTimeout(()=>{document.getElementById('loadingIndicator').style.display='none';},300);},1000);
      initWebWorker();
      initChart();
      document.querySelectorAll('.grid-cell, .num-box, #chartContainer, #xyBox').forEach(el=>{el.classList.add('performance-mode','hw-accelerate');});
      document.getElementById('themeToggle').addEventListener('click',toggleTheme);
      document.getElementById('graphToggle').addEventListener('click',toggleGraph);
      document.getElementById('startStopBtn').addEventListener('click',toggleStartStop);
      // Periyodik bellek temizleme - her 5 dakikada bir
      setInterval(function(){
        // Diziler zaten shift ile limitli, ekstra temizlik yap
        if(prices.length > 100) prices.splice(0, prices.length - 100);
        if(digits.length > 100) digits.splice(0, digits.length - 100);
        if(decimalDigits.length > 100) decimalDigits.splice(0, decimalDigits.length - 100);
        if(combinedDigits.length > 100) combinedDigits.splice(0, combinedDigits.length - 100);
        if(numColors.length > 100) numColors.splice(0, numColors.length - 100);
        if(wormLinesTop.length > 100) wormLinesTop.splice(0, wormLinesTop.length - 100);
      }, 300000); // 5 dakika

      document.getElementById('connectBtn').addEventListener('click',function(){ if(document.getElementById('connectBtn').textContent.trim()==='Disconnect'){ disconnectAPI(); } else { connectAPI(); } });
      document.getElementById('saveCheckbox').addEventListener('change',toggleSaveToken);
      document.getElementById('autoTradeBtn').addEventListener('click',toggleAutoTrade);
      document.getElementById('martingaleBtn').addEventListener('click',toggleMartingale);
      document.getElementById('martingaleInput').addEventListener('change',function(){ martingaleMultiplier = parseFloat(this.value) || 2.2; });
      document.getElementById('callBtn').addEventListener('click',function(){placeTrade('CALL');});
      document.getElementById('putBtn').addEventListener('click',function(){placeTrade('PUT');});
      document.querySelectorAll('.pair-btn').forEach(function(btn){btn.addEventListener('click',function(){selectPair(this.getAttribute('data-pair'));});});
      setInterval(updateTime,1000); updateTime();
      startWS();
      loadSavedToken();
      updateLogos();
      document.body.addEventListener('click',function initAudioOnce(){initAudio();if(audioContext&&audioContext.state==='suspended')audioContext.resume();},{once:true});
      document.body.addEventListener('touchstart',function(){if(audioContext&&audioContext.state==='suspended')audioContext.resume();},{passive:true});
      let resizeTimeout;
      window.addEventListener('resize',function(){clearTimeout(resizeTimeout);resizeTimeout=setTimeout(function(){renderXYArea();renderStartOverlay();renderTwoRowGrid();drawTrendAngle();renderDrawPanels();},100);});
      if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/service-worker.js').then(function(r){console.log('SW:',r.scope);},function(e){console.log('SW fail:',e);});});}

    // ===== ARKA PLANDA ÇALIŞMA =====
    var _wakeLock = null;
    function _requestWakeLock() {
      if('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function(wl){
          _wakeLock = wl;
          wl.addEventListener('release', function(){ setTimeout(_requestWakeLock, 1000); });
        }).catch(function(){});
      }
    }
    var _audioCtx = null;
    function _startSilentAudio() {
      try {
        if(_audioCtx) return;
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = _audioCtx.createOscillator();
        var gain = _audioCtx.createGain();
        gain.gain.value = 0.00001;
        osc.connect(gain); gain.connect(_audioCtx.destination); osc.start();
      } catch(e) {}
    }
    document.addEventListener('visibilitychange', function() {
      if(document.visibilityState === 'visible') {
        _requestWakeLock();
        if(_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
        if(wsReconnectEnabled && (!derivWS || derivWS.readyState !== WebSocket.OPEN)) _triggerReconnect();
      }
    });
    document.addEventListener('click', function initAudio() {
      _startSilentAudio(); _requestWakeLock();
    }, { once: true });

    });
  </script>
