        const sz=f.color==='blue'?'синяя':'красная',ez=l.color==='blue'?'синяя':'красная';
        const c=npCmp(f.v,f.color,l.v,l.color);
        if(c==='a')return{dir:'↓',ru:'падение',cls:'nr',sz,ez};
        if(c==='b')return{dir:'↑',ru:'рост',cls:'ng',sz,ez};
        return{dir:'→',ru:'флэт',cls:'ny',sz,ez};
      }
      const ei=stepInfo(even),oi=stepInfo(odd);

      // Flat tespiti - tüm flatler
      let flatItems=[];
      for(let i=1;i<seq.length;i++){
        if(seq[i].v===seq[i-1].v&&seq[i].color===seq[i-1].color){
          const fc=seq[i].color==='blue'?'nb':'nr';
          const label=`<span class="${fc}">${seq[i].v}${seq[i].color==='blue'?'с':'к'}</span>`;
          flatItems.push(label+'-'+label);
        }
      }

      // VZ tespiti - 1 birim fark (ardışık olmak zorunda değil, tüm çiftler)
      let vzItems=[];
      for(let i=0;i<seq.length;i++){
        for(let j=i+1;j<seq.length;j++){
          const a=seq[i],b=seq[j];
          // 1 birim fark: kırmızıda büyük sayı aşağı, mavi büyük sayı yukarı
          // Sayısal fark 1 olmalı
          const diff=Math.abs(a.v-b.v);
          if(diff===1){
            const ac=a.color==='blue'?'nb':'nr';
            const bc=b.color==='blue'?'nb':'nr';
            vzItems.push(`<span class="${ac}">${a.v}${a.color==='blue'?'с':'к'}</span>·<span class="${bc}">${b.v}${b.color==='blue'?'с':'к'}</span>`);
          }
        }
      }
      // VZ fazla olabilir, sadece benzersiz kombinasyonları göster
      vzItems=[...new Set(vzItems)].slice(0,4);

      // ===== NİKOLAS ALGORİTMASI =====
      // Her sayının gerçek değeri: mavi=+sayı, kırmızı=−sayı
      const getRealValue = (v, color) => color === 'blue' ? v : -v;

      // Max(tek) = tek sayıların en yüksek gerçek değeri
      let maxOdd = null, maxOddItem = null;
      odd.forEach(x => {
        const rv = getRealValue(x.v, x.color);
        if(maxOdd === null || rv > maxOdd){ maxOdd = rv; maxOddItem = x; }
      });

      // Min(çift) = çift sayıların en düşük gerçek değeri
      let minEven = null, minEvenItem = null;
      even.forEach(x => {
        const rv = getRealValue(x.v, x.color);
        if(minEven === null || rv < minEven){ minEven = rv; minEvenItem = x; }
      });

      // Formal sinyal
      let formalSignal = null;
      if(maxOdd !== null && minEven !== null){
        if(maxOdd > minEven) formalSignal = 'UP';
        else if(maxOdd < minEven) formalSignal = 'DOWN';
      }

      // Onay: çift adımın son değeri başlangıcına göre
      // Onay için çift adımda en az 2 sayı + toplam en az 2 çift 2 tek şart
      let confirmed = false;
      let decRu = '', decision = null;
      if(formalSignal && even.length >= 2 && odd.length >= 2){
        const evenStart = getRealValue(even[0].v, even[0].color);
        const evenEnd = getRealValue(even[even.length-1].v, even[even.length-1].color);
        if(formalSignal === 'UP' && evenEnd > evenStart){
          confirmed = true;
          decRu = 'Max нечётного > Min чётного · Подтверждение → ВВЕРХ';
          decision = 'UP';
        } else if(formalSignal === 'DOWN' && evenEnd < evenStart){
          confirmed = true;
          decRu = 'Max нечётного < Min чётного · Подтверждение → ВНИЗ';
          decision = 'DOWN';
        } else {
          decRu = 'Ожидание подтверждения...';
        }
      }

      // Rows
      rowsEl.innerHTML='';
      const s0=seq[0],s1=seq[1];
      const sc=npCmp(s0.v,s0.color,s1.v,s1.color);
      const top=sc==='a'?s0:s1,bot=sc==='a'?s1:s0;
      rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Старт:</div><div class="np-val"><span class="${top.color==='blue'?'nb':'nr'}">${top.v}${top.color==='blue'?'с':'к'}</span> выше · <span class="${bot.color==='blue'?'nb':'nr'}">${bot.v}${bot.color==='blue'?'с':'к'}</span> ниже</div></div>`;
      if(even.length>=1){const es=even.map(x=>`<span class="${x.color==='blue'?'nb':'nr'}">${x.v}</span>`).join('→');rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Чётный:</div><div class="np-val">${es} · <span class="${ei.cls}">${ei.ru} ${ei.dir}</span> · ${ei.sz}→${ei.ez}</div></div>`;}
      if(odd.length>=1){const os=odd.map(x=>`<span class="${x.color==='blue'?'nb':'nr'}">${x.v}</span>`).join('→');rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Нечётный:</div><div class="np-val">${os} · <span class="${oi.cls}">${oi.ru} ${oi.dir}</span> · ${oi.sz}→${oi.ez}</div></div>`;}
      if(minEvenItem)rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Min чётный:</div><div class="np-val"><span class="${minEvenItem.color==='blue'?'nb':'nr'}">${minEvenItem.v}${minEvenItem.color==='blue'?'с':'к'}</span> <span class="ny">(${minEven})</span></div></div>`;
      if(maxOddItem)rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Max нечётный:</div><div class="np-val"><span class="${maxOddItem.color==='blue'?'nb':'nr'}">${maxOddItem.v}${maxOddItem.color==='blue'?'с':'к'}</span> <span class="ny">(${maxOdd})</span></div></div>`;
      if(flatItems.length>0)rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Флэт:</div><div class="np-val">${flatItems.join(' · ')}</div></div>`;
      if(vzItems.length>0)rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">VZ (1ед):</div><div class="np-val">${vzItems.join(' · ')}</div></div>`;
      rowsEl.innerHTML+=`<div class="np-row"><div class="np-lbl">Итог:</div><div class="np-val nw">${decRu||'—'}</div></div>`;

      // Sinyal: toplam en az 2 çift + 2 tek (start dahil) ve onay alındıysa
      const hasMinNumbers = even.length >= 2 && odd.length >= 2 && confirmed;

      if(hasMinNumbers && decision !== null){
        decEl.style.display='block';
        decEl.className=decision==='UP'?'up':'down';
        decEl.textContent=decision==='UP'?'↑ СТАВКА ВВЕРХ':'↓ СТАВКА ВНИЗ';
        npUpdateBell(decision);
      } else {
        decEl.style.display='none';
        npUpdateBell(null);
      }

      // Grafik çiz
      npDrawSvg(seq,decision);
      // Türkçe panel
      trRender(seq,even,odd,ei,oi,flatItems,vzItems,decision,decRu,minEven,minEvenItem,maxOdd,maxOddItem,confirmed);
    }

    function trRender(seq, even, odd, ei, oi, flatItems, vzItems, decision, decRu, minEven, minEvenItem, maxOdd, maxOddItem, confirmed){
      const decEl=document.getElementById('trDecision');
      const rowsEl=document.getElementById('trRows');
      if(!rowsEl)return;
      rowsEl.innerHTML='';

      // Türkçe yön çevirisi
      const trDir=(dir)=>dir==='↑'?'yükseliş ↑':dir==='↓'?'düşüş ↓':'flat →';
      const trCls=(cls)=>cls;

      // Start
      const s0=seq[0],s1=seq[1];
      const sc=npCmp(s0.v,s0.color,s1.v,s1.color);
      const top=sc==='a'?s0:s1,bot=sc==='a'?s1:s0;
      rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Başlangıç:</div><div class="tr-val"><span class="${top.color==='blue'?'nb':'nr'}">${top.v}${top.color==='blue'?'m':'k'}</span> üstte · <span class="${bot.color==='blue'?'nb':'nr'}">${bot.v}${bot.color==='blue'?'m':'k'}</span> altta</div></div>`;

      // Çift adım
      if(even.length>=1){
        const es=even.map(x=>`<span class="${x.color==='blue'?'nb':'nr'}">${x.v}</span>`).join('→');
        rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Çift adım:</div><div class="tr-val">${es} · <span class="${ei.cls}">${trDir(ei.dir)}</span> · ${ei.sz==='синяя'?'mavi':'kırmızı'}→${ei.ez==='синяя'?'mavi':'kırmızı'}</div></div>`;
      }

      // Tek adım
      if(odd.length>=1){
        const os=odd.map(x=>`<span class="${x.color==='blue'?'nb':'nr'}">${x.v}</span>`).join('→');
        rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Tek adım:</div><div class="tr-val">${os} · <span class="${oi.cls}">${trDir(oi.dir)}</span> · ${oi.sz==='синяя'?'mavi':'kırmızı'}→${oi.ez==='синяя'?'mavi':'kırmızı'}</div></div>`;
      }

      // Min çift / Max tek
      if(minEvenItem)rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Min çift:</div><div class="tr-val"><span class="${minEvenItem.color==='blue'?'nb':'nr'}">${minEvenItem.v}${minEvenItem.color==='blue'?'m':'k'}</span> <span class="ny">(${minEven})</span></div></div>`;
      if(maxOddItem)rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Max tek:</div><div class="tr-val"><span class="${maxOddItem.color==='blue'?'nb':'nr'}">${maxOddItem.v}${maxOddItem.color==='blue'?'m':'k'}</span> <span class="ny">(${maxOdd})</span></div></div>`;

      // Flat
      if(flatItems.length>0)rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Flat:</div><div class="tr-val">${flatItems.join(' · ')}</div></div>`;

      // VZ
      if(vzItems.length>0)rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">VZ (1br):</div><div class="tr-val">${vzItems.join(' · ')}</div></div>`;

      // Sonuç
      const trDecRu=(d)=>{
        if(!d)return d;
        return d.replace('Max нечётного > Min чётного · Подтверждение → ВВЕРХ','Max tek > Min çift · Onay → YUKARI')
                .replace('Max нечётного < Min чётного · Подтверждение → ВНИЗ','Max tek < Min çift · Onay → AŞAĞI')
                .replace('Ожидание подтверждения...','Onay bekleniyor...');
      };
      rowsEl.innerHTML+=`<div class="tr-row"><div class="tr-lbl">Sonuç:</div><div class="tr-val nw">${trDecRu(decRu)||'—'}</div></div>`;

      // Karar badge — toplam en az 2 çift + 2 tek ve onay alındıysa
      if(confirmed && decision && even.length >= 2 && odd.length >= 2){
        decEl.style.display='block';
        decEl.className=decision==='UP'?'up':'down';
        decEl.textContent=decision==='UP'?'↑ BAHİS YUKARI':'↓ BAHİS AŞAĞI';
      } else {
        decEl.style.display='none';
      }
    }
    function npUpdateBell(decision){
      const box=document.getElementById('trendBellBox'),label=document.getElementById('trendLabel');
      if(!box||!label)return;
      box.classList.remove('trend-up','trend-down');
      box.style.background='';
      box.style.borderColor='';
      if(decision==='UP'){
        box.classList.add('trend-up');label.textContent='Trend ↑';
        if(npLastSignal!=='UP'){if(!bellMuted)playUpTrendSound();npLastSignal='UP';lastTrendSignal='UP';}
      } else if(decision==='DOWN'){
        box.classList.add('trend-down');label.textContent='Trend ↓';
        if(npLastSignal!=='DOWN'){if(!bellMuted)playDownTrendSound();npLastSignal='DOWN';lastTrendSignal='DOWN';}
      } else {
        // Sinyal yok — zil paneli siyah
        box.style.background='#000';
        box.style.borderColor='#333';
        label.textContent='Trend';
        npLastSignal=null;lastTrendSignal=null;
      }
    }

    function npDrawSvg(seq,decision){
      const svg=document.getElementById('npSvg');if(!svg)return;
      svg.innerHTML='';
      const ns='http://www.w3.org/2000/svg',W=200,H=90,vzY=H/2,n=seq.length;
      if(n<1)return;

      // Zone backgrounds
      const bz=document.createElementNS(ns,'rect');bz.setAttribute('x','0');bz.setAttribute('y','0');bz.setAttribute('width',String(W));bz.setAttribute('height',String(vzY));bz.setAttribute('fill','rgba(29,126,245,0.10)');svg.appendChild(bz);
      const rz=document.createElementNS(ns,'rect');rz.setAttribute('x','0');rz.setAttribute('y',String(vzY));rz.setAttribute('width',String(W));rz.setAttribute('height',String(H-vzY));rz.setAttribute('fill','rgba(230,57,70,0.10)');svg.appendChild(rz);

      // VZ line
      const vl=document.createElementNS(ns,'line');vl.setAttribute('x1','0');vl.setAttribute('y1',String(vzY));vl.setAttribute('x2',String(W));vl.setAttribute('y2',String(vzY));vl.setAttribute('stroke','#e08000');vl.setAttribute('stroke-width','1');vl.setAttribute('stroke-dasharray','4,3');vl.setAttribute('opacity','0.8');svg.appendChild(vl);
      const vt=document.createElementNS(ns,'text');vt.setAttribute('x',String(W-2));vt.setAttribute('y',String(vzY-2));vt.setAttribute('text-anchor','end');vt.setAttribute('fill','#e08000');vt.setAttribute('font-size','6');vt.setAttribute('font-family','monospace');vt.setAttribute('font-weight','900');vt.textContent='VZ';svg.appendChild(vt);

      // Zone labels
      const bt=document.createElementNS(ns,'text');bt.setAttribute('x','3');bt.setAttribute('y','9');bt.setAttribute('fill','rgba(29,126,245,0.7)');bt.setAttribute('font-size','5.5');bt.setAttribute('font-family','monospace');bt.setAttribute('font-weight','900');bt.textContent='СИНЯЯ';svg.appendChild(bt);
      const rt=document.createElementNS(ns,'text');rt.setAttribute('x',String(W-3));rt.setAttribute('y',String(H-3));rt.setAttribute('text-anchor','end');rt.setAttribute('fill','rgba(230,57,70,0.7)');rt.setAttribute('font-size','5.5');rt.setAttribute('font-family','monospace');rt.setAttribute('font-weight','900');rt.textContent='КРАСНАЯ';svg.appendChild(rt);

      const R=7,pad=R+5;
      const step=n>1?(W-pad*2)/(n-1):0;
      const gx=i=>pad+i*step;
      const gy=(v,color)=>{
        const mg=R+7;
        if(color==='blue'){return vzY-mg-(v/9)*(vzY-mg*1.5);}
        else{const val=v===0?10:v;return vzY+mg+((10-val)/10)*(H-vzY-mg*1.5);}
      };

      const pts=seq.map((x,i)=>({x:gx(i),y:gy(x.v,x.color),...x}));
      const ePts=pts.filter(p=>p.v%2===0);
      const oPts=pts.filter(p=>p.v%2!==0);

      // Odd line (solid)
      if(oPts.length>1){const pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',oPts.map(p=>`${p.x},${p.y}`).join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke',oPts[oPts.length-1].color==='blue'?'#1d7ef5':'#e63946');pl.setAttribute('stroke-width','2');pl.setAttribute('stroke-linejoin','round');pl.setAttribute('stroke-linecap','round');pl.setAttribute('opacity','0.9');svg.appendChild(pl);}
      // Even line (dashed)
      if(ePts.length>1){const pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',ePts.map(p=>`${p.x},${p.y}`).join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke',ePts[ePts.length-1].color==='blue'?'#1d7ef5':'#e63946');pl.setAttribute('stroke-width','2');pl.setAttribute('stroke-dasharray','5,3');pl.setAttribute('stroke-linejoin','round');pl.setAttribute('stroke-linecap','round');pl.setAttribute('opacity','0.9');svg.appendChild(pl);}

      // START box around first 2 points
      if(pts.length>=2){
        const p0=pts[0],p1=pts[1];
        const bx=Math.min(p0.x,p1.x)-R-4,by=Math.min(p0.y,p1.y)-R-10,bw=Math.abs(p1.x-p0.x)+(R+4)*2,bh=Math.abs(p1.y-p0.y)+R*2+16;
        const sr=document.createElementNS(ns,'rect');sr.setAttribute('x',String(bx));sr.setAttribute('y',String(by));sr.setAttribute('width',String(bw));sr.setAttribute('height',String(bh));sr.setAttribute('fill','none');sr.setAttribute('stroke','#f4c430');sr.setAttribute('stroke-width','1.5');sr.setAttribute('stroke-dasharray','4,3');sr.setAttribute('rx','4');svg.appendChild(sr);
        const sl=document.createElementNS(ns,'text');sl.setAttribute('x',String(bx+bw/2));sl.setAttribute('y',String(by-2));sl.setAttribute('text-anchor','middle');sl.setAttribute('fill','#f4c430');sl.setAttribute('font-size','5');sl.setAttribute('font-family','monospace');sl.setAttribute('font-weight','900');sl.textContent='СТАРТ';svg.appendChild(sl);
      }

      // Nodes
      pts.forEach((p,i)=>{
        const cx=p.x,cy=p.y,isEven=p.v%2===0,clr=p.color==='blue'?'#1d7ef5':'#e63946';
        // White ring
        const oc=document.createElementNS(ns,'circle');oc.setAttribute('cx',String(cx));oc.setAttribute('cy',String(cy));oc.setAttribute('r',String(R+2));oc.setAttribute('fill','white');svg.appendChild(oc);
        // Colored circle
        const ic=document.createElementNS(ns,'circle');ic.setAttribute('cx',String(cx));ic.setAttribute('cy',String(cy));ic.setAttribute('r',String(R));
        if(isEven){ic.setAttribute('fill','#1a1a1a');ic.setAttribute('stroke',clr);ic.setAttribute('stroke-width','2');}
        else{ic.setAttribute('fill',clr);}
        svg.appendChild(ic);
        // Number
        const tx=document.createElementNS(ns,'text');tx.setAttribute('x',String(cx));tx.setAttribute('y',String(cy));tx.setAttribute('text-anchor','middle');tx.setAttribute('dominant-baseline','central');tx.setAttribute('fill',isEven?clr:'white');tx.setAttribute('font-size','7');tx.setAttribute('font-weight','900');tx.setAttribute('font-family','monospace');tx.textContent=String(p.v);svg.appendChild(tx);
      });

      // Decision arrow
      if(decision){
        const ac=decision==='UP'?'#1d7ef5':'#e63946',ax=W-8,aw=5,ah=7;
        const ay=decision==='UP'?14:H-14;
        const aPts=decision==='UP'?`${ax},${ay-ah} ${ax-aw},${ay} ${ax+aw},${ay}`:`${ax},${ay+ah} ${ax-aw},${ay} ${ax+aw},${ay}`;
        const al=document.createElementNS(ns,'line');al.setAttribute('x1',String(ax));al.setAttribute('y1',String(decision==='UP'?ay:ay));al.setAttribute('x2',String(ax));al.setAttribute('y2',String(decision==='UP'?ay+8:ay-8));al.setAttribute('stroke',ac);al.setAttribute('stroke-width','2.5');al.setAttribute('stroke-linecap','round');svg.appendChild(al);
        const ap=document.createElementNS(ns,'polygon');ap.setAttribute('points',aPts);ap.setAttribute('fill',ac);svg.appendChild(ap);
      }
    }

          ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
          const digs=digits.slice(-7),combs=combinedDigits.slice(-7),worms=wormLinesTop.slice(-7);
          meta.data.forEach((pt,i)=>{let t='';if(currentGraph==='XZ')t=decs[i]||'';else if(currentGraph==='ZZ')t=digs[i]||'';else t=(combs[i]||'').replace(',','.');if(pt&&pt.x!==undefined){let fc=colors[i]||'#000';if(fc==='blue')fc='#6A9FFF';ctx.fillStyle=fc;ctx.fillText(t,pt.x,pt.y-2);const wc=worms[i];if(wc==='blue'||wc==='red'){ctx.strokeStyle=wc;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pt.x-5,pt.y-2);ctx.lineTo(pt.x+5,pt.y-2);ctx.stroke();}}});
          const last=meta.data[meta.data.length-1];if(last&&last.x!==undefined){ctx.strokeStyle=isDark?'#40E0D0':'#000';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(ci.scales.x.left,last.y);ctx.lineTo(last.x,last.y);ctx.stroke();}
        }}]
      });
    }

    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{document.getElementById('loadingIndicator').style.opacity='0';setTimeout(()=>{document.getElementById('loadingIndicator').style.display='none';},300);},1000);
      initWebWorker();initChart();
      document.querySelectorAll('.grid-cell,.num-box,#chartContainer,#xyBox').forEach(el=>el.classList.add('performance-mode','hw-accelerate'));
      document.getElementById('themeToggle').addEventListener('click',toggleTheme);
      document.getElementById('graphToggle').addEventListener('click',toggleGraph);
      document.getElementById('startStopBtn').addEventListener('click',()=>{
        const sv=document.getElementById('stakeInput').value;
        prices=[];digits=[];decimalDigits=[];combinedDigits=[];wormLinesTop=[];numColors=[];
        document.getElementById('numbersTop').innerHTML='';
        gridHistory=[];startCooldown=0;startGlobalSpan=null;xzTickCounter=0;
        currentTrendData={direction:null,last3:[],colors:[],arrows:[]};lastTrendSignal=null;trendStartGlobal=null;
        trendDrawBuffer=[];trendDrawStarted=false;lastStartSpanKey=null;
        showTrendSignal(null);showUpDownSignal(null);clearDrawPanels();npResetPanel();
        renderTwoRowGrid();renderStartOverlay();renderXYArea();drawTrendAngle();
        if(chart){chart.data.datasets[0].data=Array(7).fill(null);chart.data.labels=Array.from({length:7},(_,i)=>(i+1).toString());chart.update('none');}
        document.getElementById('price').innerText='0.00';document.getElementById('price').style.background='#0b57d0';
        document.getElementById('stakeInput').value=sv;
        if(ws){try{ws.close();}catch(e){}}if(isRunning)startWS();
      });
      setInterval(()=>{if(prices.length>100)prices.splice(0,prices.length-100);if(digits.length>100)digits.splice(0,digits.length-100);if(decimalDigits.length>100)decimalDigits.splice(0,decimalDigits.length-100);if(combinedDigits.length>100)combinedDigits.splice(0,combinedDigits.length-100);if(numColors.length>100)numColors.splice(0,numColors.length-100);if(wormLinesTop.length>100)wormLinesTop.splice(0,wormLinesTop.length-100);},300000);
      document.getElementById('trendBellBox').addEventListener('click',()=>{bellMuted=!bellMuted;document.getElementById('trendBellIcon').textContent=bellMuted?'🔕':'🔔';});
      document.getElementById('connectBtn').addEventListener('click',()=>{if(document.getElementById('connectBtn').textContent.trim()==='Disconnect')disconnectAPI();else connectAPI();});
      document.getElementById('saveCheckbox').addEventListener('change',toggleSaveToken);
      document.getElementById('autoTradeBtn').addEventListener('click',toggleAutoTrade);
      document.getElementById('martingaleBtn').addEventListener('click',toggleMartingale);
      document.getElementById('martingaleInput').addEventListener('change',function(){martingaleMultiplier=parseFloat(this.value)||2.2;});
      document.getElementById('callBtn').addEventListener('click',()=>placeTrade('CALL'));
      document.getElementById('putBtn').addEventListener('click',()=>placeTrade('PUT'));
      document.querySelectorAll('.pair-btn').forEach(btn=>btn.addEventListener('click',function(){selectPair(this.getAttribute('data-pair'));}));
      setInterval(updateTime,1000);updateTime();startWS();loadSavedToken();updateLogos();
      document.body.addEventListener('click',function io(){initAudio();if(audioContext&&audioContext.state==='suspended')audioContext.resume();},{once:true});
      document.body.addEventListener('touchstart',()=>{if(audioContext&&audioContext.state==='suspended')audioContext.resume();},{passive:true});
      let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{renderXYArea();renderStartOverlay();renderTwoRowGrid();drawTrendAngle();renderDrawPanels();npRender();},100);});
      if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').then(r=>console.log('SW:',r.scope)).catch(e=>console.log('SW fail:',e)));
      let _wl=null;
      function _rwl(){if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(wl=>{_wl=wl;wl.addEventListener('release',()=>setTimeout(_rwl,1000));}).catch(()=>{});}
      let _ac=null;
      function _sa(){try{if(_ac)return;_ac=new(window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();g.gain.value=0.00001;o.connect(g);g.connect(_ac.destination);o.start();}catch(e){}}
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){_rwl();if(_ac&&_ac.state==='suspended')_ac.resume();if(wsReconnectEnabled&&(!derivWS||derivWS.readyState!==WebSocket.OPEN))_triggerReconnect();}});
      document.addEventListener('click',function ia(){_sa();_rwl();},{once:true});
    });
  </script>

</body>
</html>
